name: Adaption pilot cost estimate only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adaption-estimate.yml'
      - 'scripts/adaption_quote.py'

permissions:
  contents: read

concurrency:
  group: adaption-estimate
  cancel-in-progress: true

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@v4

      - name: Query an estimate without launching any job
        env:
          ADAPTION_API_KEY: ${{ secrets.ADAPTION_API_KEY }}
        run: python3 -B scripts/adaption_quote.py
