name: Publish verified public PROOFBENCH seed (synthetic only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-proofbench-seed.yml'

permissions:
  contents: write

concurrency:
  group: proofbench-publish-seed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the isolated public research repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Regenerate and validate pre-registered synthetic dataset
        run: |
          python3 -m proofbench.benchmark --output generated
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          m=json.loads(Path('generated/manifest.json').read_text())
          content=Path('generated/train.jsonl').read_bytes()
          assert len(content.splitlines()) == 240
          expected='d8f0aa9eeddb77bafe0e6d8b7d616501daa8d7f36487c9148e3860ce051205e5'
          assert hashlib.sha256(content).hexdigest() == expected
          assert m['sha256']['train.jsonl'] == expected
          assert all(set(json.loads(line)) == {'prompt','completion'} for line in content.splitlines())
          print('Verified synthetic rows: 240; SHA256:', expected)
          PY
          mkdir -p datasets
          cp generated/train.jsonl datasets/proofbench_train_240.jsonl
          cp generated/manifest.json datasets/proofbench_manifest.json
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          data=[json.loads(line) for line in Path('generated/train.jsonl').read_text().splitlines()]
          assert len(data)==240
          with Path('datasets/proofbench_train_240.csv').open('w',newline='',encoding='utf-8') as fh:
              writer=csv.DictWriter(fh,fieldnames=['prompt','completion'])
              writer.writeheader()
              writer.writerows(data)
          with Path('datasets/proofbench_train_240.csv').open(newline='',encoding='utf-8') as fh:
              check=list(csv.DictReader(fh))
          assert check==data, 'CSV export differs from verified JSONL'
          print('Verified public CSV export: 240 rows')
          PY
      - name: Commit public synthetic seed to this repository only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/proofbench_train_240.jsonl datasets/proofbench_manifest.json datasets/proofbench_train_240.csv
          if git diff --cached --quiet; then
            echo "Seed already present and unchanged"
            exit 0
          fi
          git commit -m "Publish verified 240-row synthetic PROOFBENCH import source [skip ci]"
          git push origin HEAD:main
