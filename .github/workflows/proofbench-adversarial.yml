name: PROOFBENCH paired adversarial tests

on:
  push:
    branches: [main, feature/proofbench-verifiable-eval-20261120]
    paths:
      - 'proofbench/**'
      - 'tests/test_proofbench_contract.py'
      - 'tests/test_comparison.py'
      - 'tests/test_adaption_bridge.py'
      - 'tests/test_independent_audit.py'
      - 'tests/test_adaption_estimate.py'
      - '.github/workflows/proofbench-adversarial.yml'
  pull_request:
    paths:
      - 'proofbench/**'
      - 'tests/test_proofbench_contract.py'
      - 'tests/test_comparison.py'
      - 'tests/test_adaption_bridge.py'
      - 'tests/test_independent_audit.py'
      - 'tests/test_adaption_estimate.py'
      - '.github/workflows/proofbench-adversarial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Contract tests (offline, no API secrets)
        env:
          PYTHONPATH: .
        run: |
          python3 -m unittest discover -s tests -p 'test_proofbench_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_comparison.py' -v
          python3 -m unittest discover -s tests -p 'test_adaption_bridge.py' -v
          python3 -m unittest discover -s tests -p 'test_independent_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_adaption_estimate.py' -v
      - name: Produce reproducible demonstration artifacts
        if: success()
        run: python3 -m proofbench.benchmark --output generated
      - name: Upload synthetic data outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proofbench-adversarial-fixtures
          path: generated/
          retention-days: 10
