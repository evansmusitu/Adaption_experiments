name: PROOFBENCH paired adversarial tests

on:
  push:
    branches: [main, feature/proofbench-verifiable-eval-20261120, feature/proofbench-guarded-adaption-20261120]
    paths:
      - 'proofbench/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/proofbench-adaption-launch.yml'
      - 'tests/test_proofbench_contract.py'
      - 'tests/test_comparison.py'
      - 'tests/test_adaption_bridge.py'
      - 'tests/test_independent_audit.py'
      - 'tests/test_adaption_estimate.py'
      - 'tests/test_overlap.py'
      - 'tests/test_submission_gate.py'
      - 'tests/test_adaption_run.py'
      - 'tests/test_adaption_status.py'
      - 'tests/test_candidate_integrity.py'
      - 'tests/test_public_demo_evidence.py'
      - 'tests/test_hackathon_readiness_doc.py'
      - 'tests/test_oracle_recheck.py'
      - 'tests/test_reviewer_preflight.py'
      - 'demo/**'
      - '.github/workflows/proofbench-adversarial.yml'
  pull_request:
    paths:
      - 'proofbench/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/proofbench-adaption-launch.yml'
      - 'tests/test_proofbench_contract.py'
      - 'tests/test_comparison.py'
      - 'tests/test_adaption_bridge.py'
      - 'tests/test_independent_audit.py'
      - 'tests/test_adaption_estimate.py'
      - 'tests/test_overlap.py'
      - 'tests/test_submission_gate.py'
      - 'tests/test_adaption_run.py'
      - 'tests/test_adaption_status.py'
      - 'tests/test_candidate_integrity.py'
      - 'tests/test_public_demo_evidence.py'
      - 'tests/test_hackathon_readiness_doc.py'
      - 'tests/test_oracle_recheck.py'
      - 'tests/test_reviewer_preflight.py'
      - 'demo/**'
      - '.github/workflows/proofbench-adversarial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Contract tests (offline, no API secrets)
        env:
          PYTHONPATH: .
        run: |
          python3 -m unittest discover -s tests -p 'test_proofbench_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_comparison.py' -v
          python3 -m unittest discover -s tests -p 'test_adaption_bridge.py' -v
          python3 -m unittest discover -s tests -p 'test_independent_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_adaption_estimate.py' -v
          python3 -m unittest discover -s tests -p 'test_overlap.py' -v
          python3 -m unittest discover -s tests -p 'test_submission_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_adaption_run.py' -v
          python3 -m unittest discover -s tests -p 'test_adaption_status.py' -v
          python3 -m unittest discover -s tests -p 'test_candidate_integrity.py' -v
          python3 -m unittest discover -s tests -p 'test_public_demo_evidence.py' -v
          python3 -m unittest discover -s tests -p 'test_hackathon_readiness_doc.py' -v
          python3 -m unittest discover -s tests -p 'test_oracle_recheck.py' -v
          python3 -m unittest discover -s tests -p 'test_reviewer_preflight.py' -v
      - name: Produce reproducible demonstration artifacts
        if: success()
        run: python3 -m proofbench.benchmark --output generated
      - name: Independently verify all 240 generated source labels
        if: success()
        run: |
          python3 -m proofbench.oracle_recheck --train generated/train.jsonl > generated/source_oracle_audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('generated/source_oracle_audit.json').read_text())
          assert audit['ok'] is True
          assert audit['checked'] == audit['verified'] == 240
          assert set(audit['families'].values()) == {40}
          assert audit['establishes_model_accuracy'] is False
          print('Independent financial oracle confirms all 240 synthetic source labels')
          PY
      - name: Package reproducible hackathon preview
        if: success()
        run: |
          mkdir -p release/dataset
          cp -r proofbench scripts tests docs demo evidence release/
          mkdir -p release/.github
          cp -r .github/workflows release/.github/
          cp README.md release/README.md
          cp generated/*.jsonl generated/manifest.json generated/source_oracle_audit.json release/dataset/
          printf '%s\n' 'Adaption 100-row pilot dataset-quality improvement is verified (C to A). Independent model accuracy and public rights for provider outputs are NOT established. Corrected candidate remains private review-only.' > release/STATUS.txt
          test -f release/demo/index.html
          test -f release/proofbench/benchmark.py
          test -f release/.github/workflows/proofbench-adaption-launch.yml
          test -f release/dataset/train.jsonl
          python3 -m compileall -q release/proofbench release/scripts
          (cd release && PYTHONPATH=. python3 -m unittest discover -s tests -v)
          (cd release && python3 - <<'PY'
          import json, hashlib, zipfile
          from pathlib import Path
          manifest = json.loads(Path('dataset/manifest.json').read_text())
          for filename, expected in manifest['sha256'].items():
              data = (Path('dataset')/filename).read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected
          print('Released dataset SHA-256 files match all manifest hashes')
          PY
          )
      - name: Upload complete offline engineering bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proofbench-research-bundle
          path: release/
          include-hidden-files: true
          retention-days: 14
      - name: Upload synthetic data outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proofbench-adversarial-fixtures
          path: generated/
          retention-days: 10
