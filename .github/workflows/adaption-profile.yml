name: Adaption aggregate research audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adaption-profile.yml'
      - 'scripts/adaption_profile.py'

permissions:
  contents: read

concurrency:
  group: adaption-profile
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Analyze existing Adaption datasets without disclosing rows
        env:
          ADAPTION_API_KEY: ${{ secrets.ADAPTION_API_KEY }}
        run: python3 -B scripts/adaption_profile.py
