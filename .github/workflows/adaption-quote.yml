name: Adaption 100-row cost quote (no adaptation)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adaption-quote.yml'
      - 'scripts/adaption_quote.py'

permissions:
  contents: read

concurrency:
  group: adaption-quote
  cancel-in-progress: true

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Quote a fixed pilot using estimate=true only
        env:
          ADAPTION_API_KEY: ${{ secrets.ADAPTION_API_KEY }}
        run: python3 -B scripts/adaption_quote.py
